<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pago completado | Herencia Jeans</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #f7f2ec 0%, #efe7de 100%);
        color: #1f1f1f;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }

      .panel {
        max-width: 560px;
        width: calc(100% - 32px);
        background: rgba(255,255,255,0.9);
        border: 1px solid rgba(31,31,31,0.08);
        border-radius: 28px;
        box-shadow: 0 25px 60px rgba(27,26,26,0.12);
        padding: 40px 28px;
        text-align: center;
      }

      .badge {
        width: 84px;
        height: 84px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: #dff4e6;
        color: #226c3b;
        display: grid;
        place-items: center;
        font-size: 2.4rem;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 5vw, 3rem);
        letter-spacing: -0.06em;
      }

      p {
        margin: 0 auto 24px;
        color: #534d48;
        line-height: 1.7;
        max-width: 440px;
      }

      .button {
        display: inline-block;
        background: #1f1f1f;
        color: white;
        border-radius: 14px;
        padding: 15px 22px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="badge">✓</div>
      <h1>¡Pago completado!</h1>
      <p>
        Gracias por tu compra en Herencia Jeans. Tu pedido quedó confirmado y pronto recibirás un correo con los detalles del envío y la factura.
      </p>
      <a class="button" href="/">Volver a la tienda</a>
    </div>
  </body>
</html>
